<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Face Invaders</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05060f;color:#e8f0ff;font-family:'Press Start 2P',monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{display:block;max-width:100%;max-height:calc(100% - 70px);image-rendering:auto;border:2px solid #1d2450;border-radius:6px;box-shadow:0 0 40px rgba(60,255,140,.12)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;background:rgba(5,6,15,.82);padding:20px}
  #overlay.hidden{display:none}
  h1{font-size:clamp(22px,6vw,48px);color:#3dff8c;text-shadow:0 0 12px #3dff8c88,4px 4px 0 #0a3}
  .faces{display:flex;gap:18px}
  .faces img{width:72px;height:72px;border-radius:50%;border:3px solid #3dff8c;animation:bob 1s steps(2) infinite}
  .faces img:nth-child(2){animation-delay:.5s;border-color:#ff4fd8}
  @keyframes bob{50%{transform:translateY(-8px)}}
  p{font-size:clamp(9px,2.2vw,13px);line-height:2;color:#9fb0e0;max-width:520px}
  button.big{font-family:inherit;font-size:clamp(12px,3vw,16px);padding:14px 26px;background:#3dff8c;color:#05060f;border:none;border-radius:4px;cursor:pointer;box-shadow:0 4px 0 #0a3}
  button.big:active{transform:translateY(3px);box-shadow:0 1px 0 #0a3}
  #touch{display:none;width:100%;max-width:640px;height:62px;gap:8px;padding:6px 8px}
  #touch button{flex:1;font-family:inherit;font-size:18px;background:#141a3a;color:#e8f0ff;border:2px solid #2a3470;border-radius:8px}
  #touch button.fire{flex:1.4;background:#3a1430;border-color:#ff4fd8;color:#ff4fd8;font-size:13px}
  #touch button.on{background:#2a3470}
  @media (pointer:coarse){#touch{display:flex}}
  body.touch #touch{display:flex}
  #pbtn{position:absolute;top:10px;right:10px;font-family:inherit;font-size:12px;padding:10px 12px;background:#141a3a;color:#e8f0ff;border:2px solid #2a3470;border-radius:6px;cursor:pointer;z-index:2;display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="720"></canvas>
  <div id="touch">
    <button id="tl">◀</button><button class="fire" id="tf">FIRE</button><button id="tr">▶</button>
  </div>
  <button id="pbtn">II PAUSE</button>
  <div id="overlay">
    <h1>FACE INVADERS</h1>
    <div class="faces"><img id="pa" alt=""><img id="pb" alt=""></div>
    <p id="msg">They've left the office and they're coming for you.<br>← → or A D to move · SPACE to fire · P or ESC to pause</p>
    <button class="big" id="start">START</button>
  </div>
</div>

// Pre-render circular face sprites with a coloured ring, plus "hit" (red tint) variants
function sprite(img, ring, size, tint){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.save(); g.beginPath(); g.arc(size/2,size/2,size/2-3,0,Math.PI*2); g.clip();
  g.drawImage(img,0,0,size,size);
  if (tint){ g.fillStyle = tint; g.fillRect(0,0,size,size); }
  g.restore();
  g.lineWidth = 3; g.strokeStyle = ring; g.beginPath(); g.arc(size/2,size/2,size/2-2,0,Math.PI*2); g.stroke();
  return c;
}
let SPR = null;
function buildSprites(){
  SPR = {
    a: sprite(imgA,'#3dff8c',96), b: sprite(imgB,'#ff4fd8',96),
    aw: sprite(imgA,'#fff',96,'rgba(255,40,40,.45)'), bw: sprite(imgB,'#fff',96,'rgba(255,40,40,.45)'),
    ufo: sprite(Math.random()<.5?imgA:imgB,'#ffd23d',96)
  };
}

let AC = null;
function beep(freq, dur, type='square', vol=.08, slide=0){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq,t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
}
const sfx = {
  shoot(){beep(880,.12,'square',.05,-600)},
  hit(){beep(220,.25,'sawtooth',.08,-180)},
  boom(){beep(120,.6,'sawtooth',.12,-90)},
  step(i){beep([98,92,87,82][i%4],.08,'square',.06)},
  ufo(){beep(600,.3,'triangle',.05,400)}
};

// ---------- game state ----------
const COLS = 8, ROWS = 5, SZ = 50, GAPX = 18, GAPY = 14;
let state, keys = {}, stars = [];
for (let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.3,v:Math.random()*.4+.1});

function newGame(){
  state = {score:0, lives:3, level:1, hi:+(load()||0), over:false, paused:false};
  newLevel();
}
function load(){ try{return localStorage.getItem('faceinv_hi')}catch(e){return 0} }
function save(v){ try{localStorage.setItem('faceinv_hi',v)}catch(e){} }

function newLevel(){
  const s = state;
  s.player = {x:W/2, y:H-60, w:46, h:20, cool:0, dead:0, inv:90};
  s.bullets = []; s.bombs = []; s.parts = []; s.texts = [];
  s.inv = [];
  const gridW = COLS*SZ + (COLS-1)*GAPX;
  const startY = 90 + Math.min(s.level-1,5)*14;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const kind = (r+c)%2 ? 'b':'a';
    s.inv.push({x:(W-gridW)/2 + c*(SZ+GAPX), y:startY + r*(SZ+GAPY), alive:true, kind, pts:(ROWS-r)*10, flash:0, row:r});
  }
  s.dir = 1; s.stepT = 0; s.stepN = 0;
  s.ufo = null; s.ufoT = 600 + Math.random()*600;
  s.shields = [];
  for (let i=0;i<4;i++){
    const bx = 70 + i*((W-140-80)/3), by = H-150;
    const blocks = [];
    for (let y=0;y<6;y++) for (let x=0;x<10;x++){
      if (y===0 && (x===0||x===9)) continue;
      if (y>=4 && x>=3 && x<=6) continue;
      blocks.push({x:bx+x*8, y:by+y*8, hp:3});
    }
    s.shields.push(...blocks);
  }
  s.banner = 120;
}

function alive(){ return state.inv.filter(v=>v.alive) }

function explode(x,y,col,n=18){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
    state.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*20,col});
  }
}

// ---------- update ----------
function update(){
  const s = state;
  if (!s || s.over || s.paused) return;
  if (s.banner>0) s.banner--;
  const p = s.player;

  // player
  if (p.dead>0){ p.dead--; if (p.dead===0){ if (s.lives<=0) return gameOver(); p.x=W/2; p.inv=120; } }
  else {
    const sp = 6;
    if (keys.left) p.x -= sp;
    if (keys.right) p.x += sp;
    if (touchX !== null){ const d = touchX - p.x; p.x += Math.max(-8, Math.min(8, d)); }
    p.x = Math.max(p.w/2+6, Math.min(W-p.w/2-6, p.x));
    if (p.cool>0) p.cool--;
    if (keys.fire && p.cool===0 && s.bullets.length<2){
      s.bullets.push({x:p.x, y:p.y-14}); p.cool = 16; sfx.shoot();
    }
    if (p.inv>0) p.inv--;
  }

  // bullets
  for (const b of s.bullets) b.y -= 10;
  s.bullets = s.bullets.filter(b=>b.y>-10);

  // invader march — speeds up as they thin out and per level
  const live = alive();
  const interval = Math.max(3, Math.floor(4 + live.length*0.9 - (s.level-1)*3));
  if (++s.stepT >= interval){
    s.stepT = 0; s.stepN++; sfx.step(s.stepN);
    const dx = 10*s.dir;
    let hitEdge = live.some(v => v.x+dx < 10 || v.x+SZ+dx > W-10);
    if (hitEdge){ s.dir *= -1; for (const v of live) v.y += 22; }
    else for (const v of live) v.x += dx;
  }

  // invader bombs: from the lowest invader in a random column
  const bombChance = 0.012 + s.level*0.006;
  if (live.length && Math.random() < bombChance && s.bombs.length < 3 + s.level){
    const shooter = live[Math.floor(Math.random()*live.length)];
    const lowest = live.filter(v=>Math.abs(v.x-shooter.x)<5).sort((a,b)=>b.y-a.y)[0];
    s.bombs.push({x:lowest.x+SZ/2, y:lowest.y+SZ, t:0, v:3+s.level*0.4+Math.random()*1.2});
  }
  for (const b of s.bombs){ b.y += b.v; b.t++; }
  s.bombs = s.bombs.filter(b=>b.y<H+10);

  // UFO (a big bonus face)
  if (!s.ufo && --s.ufoT<=0){
    const fromLeft = Math.random()<.5;
    s.ufo = {x: fromLeft?-60:W+60, y:52, v: fromLeft?2.2:-2.2, sz:44};
    SPR.ufo = sprite(Math.random()<.5?imgA:imgB,'#ffd23d',96);
    sfx.ufo();
  }
  if (s.ufo){
    s.ufo.x += s.ufo.v;
    if (s.ufo.x<-80||s.ufo.x>W+80){ s.ufo=null; s.ufoT = 700+Math.random()*800; }
  }

  // collisions: bullets vs invaders / ufo / shields
  for (const b of s.bullets){
    for (const v of live){
      if (v.alive && b.x>v.x+4 && b.x<v.x+SZ-4 && b.y>v.y && b.y<v.y+SZ){
        v.alive = false; b.y = -99;
        s.score += v.pts;
        explode(v.x+SZ/2, v.y+SZ/2, v.kind==='a'?'#3dff8c':'#ff4fd8');
        s.texts.push({x:v.x+SZ/2,y:v.y+SZ/2,t:v.pts,life:40});
        sfx.hit();
        break;
      }
    }
    if (s.ufo && Math.abs(b.x-s.ufo.x)<s.ufo.sz/2 && Math.abs(b.y-s.ufo.y)<s.ufo.sz/2){
      const pts = [50,100,150,300][Math.floor(Math.random()*4)];
      s.score += pts; explode(s.ufo.x,s.ufo.y,'#ffd23d',30);
      s.texts.push({x:s.ufo.x,y:s.ufo.y,t:pts,life:60});
      s.ufo = null; s.ufoT = 900+Math.random()*700; b.y=-99; sfx.boom();
    }
    for (const k of s.shields){
      if (k.hp>0 && b.x>k.x-1 && b.x<k.x+9 && b.y>k.y && b.y<k.y+8){ k.hp--; b.y=-99; break; }
    }
  }
  // bombs vs shields / player
  for (const b of s.bombs){
    for (const k of s.shields){
      if (k.hp>0 && b.x>k.x-2 && b.x<k.x+10 && b.y+8>k.y && b.y<k.y+8){ k.hp--; b.y=H+99; break; }
    }
    if (p.dead===0 && p.inv===0 && Math.abs(b.x-p.x)<p.w/2 && b.y>p.y-12 && b.y<p.y+12){
      b.y = H+99; killPlayer();
    }
  }
  // invaders crunch shields / reach player
  for (const v of live){
    for (const k of s.shields) if (k.hp>0 && k.x+8>v.x && k.x<v.x+SZ && k.y+8>v.y && k.y<v.y+SZ) k.hp=0;
    if (v.y+SZ >= p.y-10){ s.lives = 0; killPlayer(); break; }
  }

  // particles & floating text
  for (const q of s.parts){ q.x+=q.vx; q.y+=q.vy; q.vx*=.96; q.vy*=.96; q.life--; }
  s.parts = s.parts.filter(q=>q.life>0);
  for (const t of s.texts){ t.y-=.7; t.life--; }
  s.texts = s.texts.filter(t=>t.life>0);

  if (s.score > s.hi){ s.hi = s.score; save(s.hi); }

  if (!alive().length){ s.level++; s.lives = Math.min(5, s.lives+1); newLevel(); }
}

function killPlayer(){
  const s = state, p = s.player;
  if (p.dead) return;
  s.lives = Math.max(0, s.lives-1);
  explode(p.x,p.y,'#7fd4ff',36); sfx.boom();
  p.dead = 80; s.bombs = [];
}

function gameOver(){
  state.over = true;
  showOverlay('GAME OVER', `Score ${state.score} · Level ${state.level}<br>High score ${state.hi}`, 'PLAY AGAIN');
}

// ---------- draw ----------
function draw(){
  const s = state;
  ctx.fillStyle = '#05060f'; ctx.fillRect(0,0,W,H);
  for (const st of stars){ st.y += st.v; if (st.y>H) st.y=0; ctx.fillStyle=`rgba(200,220,255,${st.s/2})`; ctx.fillRect(st.x,st.y,st.s,st.s); }
  if (!s) return;

  // HUD
  ctx.font = '14px "Press Start 2P", monospace'; ctx.textBaseline='top';
  ctx.fillStyle='#9fb0e0'; ctx.textAlign='left'; ctx.fillText('SCORE', 16, 14);
  ctx.fillStyle='#fff'; ctx.fillText(String(s.score).padStart(5,'0'), 100, 14);
  ctx.textAlign='center'; ctx.fillStyle='#9fb0e0'; ctx.fillText('HI '+String(s.hi).padStart(5,'0'), W/2+40, 14);
  ctx.textAlign='right'; ctx.fillStyle='#9fb0e0'; ctx.fillText('LV '+s.level, W-16, 14);

  // invaders: wobble between frames
  const wob = (s.stepN%2)?-3:3;
  for (const v of s.inv){
    if (!v.alive) continue;
    const key = v.kind;
    ctx.save();
    ctx.translate(v.x+SZ/2, v.y+SZ/2);
    ctx.rotate((wob*(v.row%2?1:-1))*Math.PI/180*2);
    ctx.drawImage(SPR[key], -SZ/2, -SZ/2, SZ, SZ);
    ctx.restore();
  }
  // ufo
  if (s.ufo){
    const u=s.ufo;
    ctx.save(); ctx.shadowColor='#ffd23d'; ctx.shadowBlur=18;
    ctx.translate(u.x,u.y); ctx.rotate(Math.sin(performance.now()/120)*.25);
    ctx.drawImage(SPR.ufo,-u.sz/2,-u.sz/2,u.sz,u.sz); ctx.restore();
  }

  // shields
  for (const k of s.shields){
    if (k.hp<=0) continue;
    ctx.fillStyle = ['','#1f7a45','#2fbf68','#3dff8c'][k.hp];
    ctx.fillRect(k.x,k.y,8,8);
  }

  // player cannon
  const p = s.player;
  if (!p.dead && !(p.inv>0 && Math.floor(p.inv/6)%2)){
    ctx.fillStyle='#7fd4ff'; ctx.shadowColor='#7fd4ff'; ctx.shadowBlur=10;
    ctx.fillRect(p.x-p.w/2, p.y, p.w, 14);
    ctx.fillRect(p.x-p.w/2+6, p.y-6, p.w-12, 8);
    ctx.fillRect(p.x-3, p.y-16, 6, 12);
    ctx.shadowBlur=0;
  }

  // bullets
  ctx.fillStyle='#fff';
  for (const b of s.bullets){ ctx.fillRect(b.x-2,b.y-10,4,14); }
  // bombs (zigzag)
  ctx.strokeStyle='#ff6b6b'; ctx.lineWidth=3;
  for (const b of s.bombs){
    ctx.beginPath(); const z = (b.t>>2)%2?3:-3;
    ctx.moveTo(b.x,b.y-10); ctx.lineTo(b.x+z,b.y-5); ctx.lineTo(b.x-z,b.y); ctx.lineTo(b.x,b.y+5); ctx.stroke();
  }
  // particles
  for (const q of s.parts){ ctx.globalAlpha = Math.min(1,q.life/30); ctx.fillStyle=q.col; ctx.fillRect(q.x-2,q.y-2,4,4); }
  ctx.globalAlpha = 1;
  ctx.font='12px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const t of s.texts){ ctx.globalAlpha=Math.min(1,t.life/20); ctx.fillStyle='#ffd23d'; ctx.fillText('+'+t.t,t.x,t.y); }
  ctx.globalAlpha = 1;

  // ground + lives
  ctx.fillStyle='#3dff8c'; ctx.fillRect(0,H-30,W,2);
  ctx.fillStyle='#7fd4ff';
  for (let i=0;i<s.lives;i++){ const x=24+i*36, y=H-20; ctx.fillRect(x,y,26,9); ctx.fillRect(x+11,y-6,4,6); }

  if (s.banner>0 && !s.over){
    ctx.globalAlpha = Math.min(1, s.banner/30);
    ctx.font='24px "Press Start 2P", monospace'; ctx.fillStyle='#3dff8c'; ctx.textAlign='center';
    ctx.fillText('WAVE '+s.level, W/2, H/2+40);
    ctx.globalAlpha=1;
  }
  if (s.paused && !s.over){
    ctx.fillStyle='rgba(5,6,15,.6)'; ctx.fillRect(0,0,W,H);
    ctx.font='24px "Press Start 2P", monospace'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('PAUSED',W/2,H/2);
    ctx.font='11px "Press Start 2P", monospace'; ctx.fillStyle='#9fb0e0'; ctx.fillText('Tap the game or ▶ RESUME to carry on',W/2,H/2+40);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

// ---------- input ----------
const map = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire',ArrowUp:'fire',KeyW:'fire'};
addEventListener('keydown', e=>{
  if (map[e.code]){ keys[map[e.code]] = true; e.preventDefault(); }
  if (e.code==='KeyP' || e.code==='Escape'){ togglePause(); return; }
  if (!ov.classList.contains('hidden')){ if (e.code==='Enter'||e.code==='Space') start(); return; }
  if (state && state.paused && (e.code==='Space'||e.code==='Enter')){ e.preventDefault(); keys={}; setPause(false); }
});
addEventListener('keyup', e=>{ if (map[e.code]) keys[map[e.code]] = false; });
function hold(id, k){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); keys[k]=true; el.classList.add('on'); };
  const off = e=>{ e.preventDefault(); keys[k]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off); el.addEventListener('pointercancel',off);
}
hold('tl','left'); hold('tr','right'); hold('tf','fire');
function setPause(v){
  if (!state || state.over) return;
  state.paused = v; keys = {}; touchX = null; dragId = null;
  pbtn.textContent = v ? '▶ RESUME' : 'II PAUSE';
  if (!v){ try{ AC && AC.resume(); }catch(e){} window.focus(); }
}
function togglePause(){ if (state && !state.over) setPause(!state.paused); }
const pbtn = document.getElementById('pbtn');
pbtn.addEventListener('click', e=>{ e.stopPropagation(); togglePause(); pbtn.blur(); });
function canvasX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; }
let dragId = null;
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if (!state || state.over) return;
  if (state.paused){ setPause(false); return; }
  if (e.pointerType === 'mouse') return;   // mouse players use the keyboard
  dragId = e.pointerId; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  touchX = canvasX(e); keys.fire = true;
});
cv.addEventListener('pointermove', e=>{ if (e.pointerId === dragId) touchX = canvasX(e); });
function endDrag(e){ if (e.pointerId === dragId){ dragId = null; touchX = null; keys.fire = false; } }
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('blur', ()=>{ keys={}; if (state && !state.over && !state.paused) setPause(true); });

const ov = document.getElementById('overlay');
function showOverlay(title, msg, btn){
  ov.querySelector('h1').textContent = title;
  document.getElementById('msg').innerHTML = msg;
  document.getElementById('start').textContent = btn;
  ov.classList.remove('hidden');
  pbtn.style.display='none';
}
function start(){
  try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); } catch(e){}
  keys = {};
  ov.classList.add('hidden');
  newGame();
  pbtn.style.display='block'; pbtn.textContent='II PAUSE';
}
document.getElementById('start').addEventListener('click', start);

let loaded = 0;
[imgA,imgB].forEach(im=>{ const done=()=>{ if(++loaded===2){ buildSprites(); loop(); } }; im.complete?done():im.onload=done; });
</script>
</body>
